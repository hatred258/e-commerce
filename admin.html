<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Drift District</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-container {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .password-gate {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .password-box {
            background: #111;
            border: 2px solid #f5c518;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(245, 197, 24, 0.2);
        }

        .password-box h2 {
            color: #f5c518;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .password-box p {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .password-box input {
            width: 100%;
            padding: 18px 25px;
            background: #000;
            border: 2px solid #333;
            color: #fff;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
            transition: 0.3s;
        }

        .password-box input:focus {
            border-color: #f5c518;
            box-shadow: 0 0 20px rgba(245, 197, 24, 0.3);
        }

        .password-box button {
            width: 100%;
            padding: 18px;
            background: #f5c518;
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.3s;
        }

        .password-box button:hover {
            background: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245, 197, 24, 0.4);
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: #111;
            border: 2px solid #f5c518;
            border-radius: 15px;
        }

        .admin-header h2 {
            color: #f5c518;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .admin-header p {
            color: #888;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #111;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            transition: 0.3s;
        }

        .stat-card:hover {
            border-color: #f5c518;
            transform: translateY(-5px);
        }

        .stat-card h4 {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .stat-card p {
            color: #f5c518;
            font-size: 32px;
            font-weight: 900;
        }

        .admin-order-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .admin-order-card:hover {
            border-color: #f5c518;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(245, 197, 24, 0.1);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            gap: 15px;
        }

        .order-id {
            color: #f5c518;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .detail-group h4 {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .detail-group p {
            color: #fff;
            font-size: 15px;
        }

        .items-list {
            background: #0d0d0d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .items-list h4 {
            color: #f5c518;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #222;
            color: #ccc;
            font-size: 14px;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .hidden { 
            display: none !important; 
        }

        .no-orders {
            text-align: center;
            padding: 80px 20px;
            color: #888;
        }

        .admin-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #f5c518;
            color: #000;
            padding: 16px 28px;
            border-radius: 12px;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10001;
            animation: slideIn 0.3s ease, fadeOut 0.3s 2.7s forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(20px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <h1>DRIFT DISTRICT</h1>
        <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        
        <div class="dropdown">
            <a>Company ▼</a>
            <div class="dropdown-content">
                <a href="about.html">About Us</a>
                <a href="team.html">Our Team</a>
                <a href="suppliers.html">Suppliers</a>
            </div>
        </div>
        
        <div class="dropdown">
            <a>Support ▼</a>
            <div class="dropdown-content">
                <a href="contact.html">Contact</a>
                <a href="admin.html">Admin Panel</a>
            </div>
        </div>
    </nav>
</header>

<div class="password-gate" id="passwordGate">
    <div class="password-box">
        <h2>🔒 ADMIN ACCESS</h2>
        <p>Enter password to view all orders</p>
        <input type="password" id="adminPassword" placeholder="Enter password..." onkeypress="if(event.key==='Enter')checkPassword()">
        <button onclick="checkPassword()">ENTER</button>
        <p id="errorMsg" style="color: #ef4444; margin-top: 20px; display: none; font-weight: bold;">Wrong password!</p>
    </div>
</div>

<div class="admin-container hidden" id="adminDashboard">
    <div class="admin-header">
        <h2>📦 ORDER MANAGEMENT</h2>
        <p>View all customer orders</p>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <h4>Total Orders</h4>
            <p id="totalOrders">0</p>
        </div>
        <div class="stat-card">
            <h4>Total Revenue</h4>
            <p id="totalRevenue">₱0</p>
        </div>
    </div>

    <div id="ordersList"></div>
</div>

<footer>
    <div class="footer-content">
        <div class="social-links">
            <a href="#" class="instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" class="tiktok"><i class="fab fa-tiktok"></i></a>
            <a href="#" class="youtube"><i class="fab fa-youtube"></i></a>
            <a href="#" class="discord"><i class="fab fa-discord"></i></a>
        </div>
        <p class="copyright">© 2026 DRIFT DISTRICT. STAY SIDEWAYS. 🏎️💨</p>
    </div>
</footer>

<script>
    const ADMIN_PASSWORD = 'drift2026';
    
    function showNotification(msg) {
        const notif = document.createElement('div');
        notif.className = 'admin-notification';
        notif.innerText = msg;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    }
    
    function checkPassword() {
        const input = document.getElementById('adminPassword').value;
        if (input === ADMIN_PASSWORD) {
            document.getElementById('passwordGate').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadOrders();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
            document.querySelector('.password-box').style.animation = 'shake 0.5s';
            setTimeout(() => {
                document.querySelector('.password-box').style.animation = '';
            }, 500);
        }
    }
    
    function loadOrders() {
        let orders = JSON.parse(localStorage.getItem('driftOrders')) || [];
        
        document.getElementById('totalOrders').textContent = orders.length;
        
        const revenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);
        document.getElementById('totalRevenue').textContent = '₱' + revenue.toLocaleString();
        
        const container = document.getElementById('ordersList');
        
        if (orders.length === 0) {
            container.innerHTML = `
                <div class="no-orders">
                    <p style="font-size: 48px; margin-bottom: 20px;">📭</p>
                    <p style="font-size: 18px; margin-bottom: 10px;">No orders found</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = orders.map(order => `
            <div class="admin-order-card">
                <div class="order-header">
                    <div>
                        <span class="order-id">#${order.id}</span>
                        <p style="color: #666; font-size: 12px; margin-top: 8px;">
                            📅 ${order.date || 'N/A'} | 
                            👤 ${order.customer?.name || 'N/A'} | 
                            📱 ${order.customer?.phone || 'N/A'}
                        </p>
                    </div>
                </div>
                
                <div class="order-details">
                    <div class="detail-group">
                        <h4>Total Amount</h4>
                        <p>₱${(order.total || 0).toLocaleString()}</p>
                    </div>
                </div>
                
                <div class="items-list">
                    <h4>Order Items (${order.items?.length || 0})</h4>
                    ${order.items?.map(item => `
                        <div class="item-row">
                            <span>${item.name} x ${item.quantity}</span>
                            <span>₱${((item.price || 0) * (item.quantity || 1)).toLocaleString()}</span>
                        </div>
                    `).join('') || '<div class="item-row">No items</div>'}
                </div>
            </div>
        `).join('');
    }
    
    window.checkPassword = checkPassword;
    window.loadOrders = loadOrders;
</script>

</body>
</html>
